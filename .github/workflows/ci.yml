name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: delivery-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: delivery-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: ./node_modules/.bin/tsc -p tsconfig.json --noEmit --incremental false

      - name: Build
        run: npm run build

      - name: Build runtime container
        run: docker build --target runtime --tag delivery-backend:ci .

      - name: Unit tests
        run: npm test -- --no-cache --configLoader runner

      - name: Isolated HTTP e2e tests
        run: npm run test:e2e -- --no-cache --configLoader runner

      - name: Pull isolated PostGIS test image
        # The integration test helpers never pull images themselves (--pull=never);
        # CI runners don't have them cached, so pull them once before the test run.
        run: docker pull postgis/postgis:16-3.4

      - name: Pull isolated Redis test image
        run: docker pull redis:7-alpine

      - name: Real-database integration tests
        run: npm run test:integration -- --no-cache --configLoader runner
